# Pane options
set -g mouse on
set -g base-index 1
set -g display-panes-time 2000

# Windows options
setw -g pane-base-index 1
setw -g mode-keys vi

# Navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Navigation with Alt
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Move panes around quicky
unbind -n M-J
bind -n M-J swap-pane -D
unbind -n M-K
bind -n M-K swap-pane -U

# Swap window left/right
bind -n M-S-Left  run-shell 'tmux swap-window -d -t $(( $(tmux display-message -p "#I") - 1 ))'
bind -n M-S-Right run-shell 'tmux swap-window -d -t $(( $(tmux display-message -p "#I") + 1 ))'

# Window navigation
bind -n M-Left prev
bind -n M-Right next

# Alt + number to move to that window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# Resizing
bind-key -r -T prefix C-h resize-pane -L
bind-key -r -T prefix C-j resize-pane -D
bind-key -r -T prefix C-k resize-pane -U
bind-key -r -T prefix C-l resize-pane -R
bind-key -n M-å resize-pane -x 50% -y 50%

# Alt + m to resize with an vertical layout / editor on the left
unbind -n M-m
unbind -n M-M
bind -n M-m run-shell "~/.config/tmux/scripts/resize-adaptable.sh -l main-vertical -p 40"
bind -n M-M run-shell "~/.config/tmux/scripts/resize-adaptable.sh -l main-horizontal -p 50"

# Close a pane
unbind -n M-x
unbind -n M-X
bind -n M-X kill-pane

# New window with Alt + N
unbind -n M-n
bind -n M-n new-window

# Clear all panes (Alacritty binding: Ctrl + Shift + L = F12) 
unbind -n C-l
bind -n C-l send-keys C-l
unbind -n F12
bind -n F12 setw synchronize-panes on \; send-keys C-l \; setw synchronize-panes off

# (Alacritty binding: Ctrl + Shift + S = F11) 
unbind -n C-s
bind -n C-s setw synchronize-panes on
unbind -n F11
bind -n F11 setw synchronize-panes off

# Alt + v to start copy mode / Alt + p to paste 
unbind -n M-c
unbind -n M-p
unbind -n M-v
bind -n M-v copy-mode
bind -n M-p paste-buffer -p

# Recommended for editors
set-option -sg escape-time 0
set-option -g focus-events on

# More options
set-option -g default-terminal "$TERM"
set-option -ga terminal-overrides ",$TERM:Tc"
set-option -g renumber-windows on

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind -n M-ø split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind -n M-æ split-window -h -c "#{pane_current_path}"

# Full splits
bind "|" split-window -hf -c "#{pane_current_path}"
bind -n M-Æ split-window -hf -c "#{pane_current_path}"
bind "-" split-window -vf -c "#{pane_current_path}"
bind -n M-Ø split-window -vf -c "#{pane_current_path}"

# Reload tmux config
bind R source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Clipboard
set -s set-clipboard external

# URL jumping in copy mode:
# u = jump to previous URL and select it
# U = jump to next URL and select it
URL_REGEX="(https?://|ftp://|file://)[[:alnum:]_.~!*'();:@&=+$,/?#%[-]+"
unbind -Tcopy-mode-vi u
unbind -Tcopy-mode-vi U
bind -Tcopy-mode-vi u send -X search-backward $URL_REGEX
bind -Tcopy-mode-vi U send -X search-forward $URL_REGEX

# file jumping in copy mode:
# y = jump to previous file and select it
# Y = jump to next file and select it
FILE_REGEX='([^[:space:]{}()]{6,}/|[^[:space:]{}()]*[^[:space:].{}()]\.(rs|md|markdown|py|pyi|js|jsx|jpeg|jpg|png|pdf|mp3|mp4|ts|tsx|html?|phtml|css|scss|sass|less|jsonc?|ya?ml|sh|bash|zsh|fish|cc|cpp|cxx|hpp|go|sql|toml|ini|conf|env)|[^[:space:]{}()]+/[^[:space:]{}()]*\.(c|h))'
unbind -Tcopy-mode-vi i
unbind -Tcopy-mode-vi I
bind -Tcopy-mode-vi i send -X search-backward $FILE_REGEX
bind -Tcopy-mode-vi I send -X search-forward $FILE_REGEX

# Find IPv4/IPv6 addresses
IP_REGEX='(([0-9]{1,3}\.){3}[0-9]{1,3}|([0-9a-fA-F]{0,4}:){2,7}[0-9a-fA-F]{0,4})'
unbind -Tcopy-mode-vi o
unbind -Tcopy-mode-vi O
bind -Tcopy-mode-vi o send -X search-backward $IP_REGEX
bind -Tcopy-mode-vi O send -X search-forward $IP_REGEX

# Conditional configuration for different operating systems
if-shell 'uname | grep -q Linux' 'source-file ~/.config/tmux/tmux-linux.conf'
if-shell 'uname | grep -q Darwin' 'source-file ~/.config/tmux/tmux-macos.conf'

# Pane configuration
set -g pane-base-index 1
set -g pane-border-status bottom
set -g pane-border-format "#P: #{pane_current_command}"
set -g pane-border-lines heavy

# Long history
set-option -g history-limit 100000

# Styling
# Search matches / highlight:
set -g copy-mode-match-style "bg=#504945"
set -g copy-mode-current-match-style "bg=#d65d0e"
set -g mode-style "bg=#d65d0e"
# Current pane with a black background
set -g window-active-style 'bg=black'
# set -g window-style 'bg=black' 

# -----------------------------------------------------------------------------
# Plugins
set -g @plugin 'Morantron/tmux-fingers'
# Theme
set -g @plugin 'maxpetretta/tmux-monokai-pro'
# Autoreload tmux config
set -g @plugin 'b0o/tmux-autoreload'
# Save / restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

#set -g pane-active-border-style "bg=default fg=color226"
#set -g message-style 'fg=yellow'
