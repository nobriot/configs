[language-server.pyrefly]
command = "pyrefly"
args = ["lsp"]

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.ast-grep]
command = "sg"
args = ["lsp"]

[language-server.emoji-lsp]
command = "emoji-lsp"
args = []

[[language]]
name = "rust"
scope = "source.rust"
injection-regex = "rust"
file-types = ["rs"]
roots = ["Cargo.toml", "Cargo.lock"]
formatter = { command = "rustup", args = [
  "run",
  "nightly",
  "rustfmt",
  "--edition",
  "2024",
] }
auto-format = true
indent = { tab-width = 2, unit = "  " }
language-servers = ["rust-analyzer", "ast-grep", "emoji-lsp"]
rulers = [100]

[language-server.rust-analyzer.config.check]
command = "clippy"

[language.auto-pairs]
'(' = ')'
'{' = '}'
'[' = ']'
'"' = '"'
'`' = '`'
'<' = '>'

[[language]]
name = "markdown"
language-servers = ["marksman", "emoji-lsp"]
rulers = [80]
text-width = 80

[[language]]
name = "python"
language-servers = ["ruff", "pyrefly", "pyright", "ast-grep", "emoji-lsp"]
formatter = { command = "black", args = ["--quiet", "-"] }
auto-format = true
rulers = [88]

[[language]]
name = "html"
file-types = ["html", "htm", "phtml"]
language-servers = [
  "vscode-html-language-server",
  "tailwindcss-ls",
  "emoji-lsp",
]
formatter = { command = 'prettier', args = ["--parser", "html"] }
auto-format = true

[[language]]
name = "css"
formatter = { command = 'prettier', args = ["--parser", "css"] }
auto-format = true

[[language]]
name = "json"
language-servers = ["vscode-json-language-server"]
formatter = { command = 'prettier', args = ["--parser", "json"] }

[[language]]
name = "yaml"
language-servers = ["yaml-language-server"]
formatter = { command = 'prettier', args = ["--parser", "yaml"] }
auto-format = true

[[language]]
name = "bash"
language-servers = ["bash-language-server"]

[[language]]
name = "c"
language-servers = ["clangd"]

[[language]]
name = "go"
language-servers = ["gopls"]

[[language]]
name = "dockerfile"
language-servers = ["docker-langserver"]

[[language]]
name = "toml"
formatter = { command = "taplo", args = ["format", "-"] }
auto-format = true

[[language]]
name = "dockerfile"
file-types = { glob = "Dockerfile*" }

[[language]]
name = "make"
file-types = { glob = "Makefile*" }
